[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "worldrole-free-sources"
version = "0.2.0"
description = "Free job sources and private application workflow MCP companion for WorldRole"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==2.2.0"]

[project.scripts]
worldrole-free-sources = "worldrole_free_sources.server:main"

[tool.setuptools.packages.find]
where = ["src"]
